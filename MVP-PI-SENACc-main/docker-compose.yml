version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookclub_hub
      POSTGRES_USER: bookclub
      POSTGRES_PASSWORD: bookclub_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: bookclub_hub
      DATABASE_USER: bookclub
      DATABASE_PASSWORD: bookclub_secret
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "5000"
      FLASK_DEBUG: "true"
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
